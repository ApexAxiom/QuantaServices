name: Deploy website to Cloudflare

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quantaservices-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint && node --experimental-strip-types --test tests/contact.test.mjs && npm run build -- --webpack
      - name: Deploy static pages and contact function
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx --yes wrangler@4.129.0 pages deploy out --project-name quantaservices --branch main --commit-hash "$GITHUB_SHA"
